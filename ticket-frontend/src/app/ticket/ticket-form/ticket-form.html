<div class="ticket-form-page">
  <form class="card" [formGroup]="ticketForm" (ngSubmit)="onSubmit()">
    <h2>{{ ticketId ? 'Modifier le ticket' : 'Nouveau ticket' }}</h2>

    <label>
      Titre
      <input formControlName="titre">
    </label>

    <label>
      Description
      <textarea formControlName="description"></textarea>
    </label>

    <label>
      Priorité (1-5)
      <input formControlName="priorite" type="number" min="1" max="5">
    </label>

    <label>
      Statut
      <select formControlName="statut">
        <option value="OUVERT">Ouvert</option>
        <option value="EN_COURS">En cours</option>
        <option value="RESOLU">Résolu</option>
      </select>
    </label>

    <label>
      Projet
      <select formControlName="projetId">
        <option [value]="0" disabled>Choisir un projet</option>
        @for (projet of projets; track projet.id) {
          <option [value]="projet.id">{{ projet.nom }}</option>
        }
      </select>
    </label>

    <label>
      Auteur
      <select formControlName="auteurId">
        <option [value]="0" disabled>Choisir un auteur</option>
        @for (utilisateur of utilisateurs; track utilisateur.id) {
          <option [value]="utilisateur.id">{{ utilisateur.nom }}</option>
        }
      </select>
    </label>

    <label>
      Assigné
      <select formControlName="assigneeId">
        <option [value]="0" disabled>Choisir un assigné</option>
        @for (utilisateur of utilisateurs; track utilisateur.id) {
          <option [value]="utilisateur.id">{{ utilisateur.nom }}</option>
        }
      </select>
    </label>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    <button type="submit">{{ ticketId ? 'Modifier' : 'Créer' }}</button>
  </form>
</div>
